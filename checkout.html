    <meta name="description" content="Complete your order at Novahub securely. Fast delivery across Bangladesh. Cash on Delivery available.">

<body class="checkout-page">

    <div class="checkout-topbar">
        <button class="checkout-back-btn" onclick="goBack()" aria-label="Back">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="checkout-brand">NOVA<span class="brand-red">HUB</span></div>
        <div class="checkout-topbar-spacer"></div>
    </div>

    <main class="container checkout-container">
        <div class="checkout-wrapper">
            
            <div class="checkout-card">
                <h2 class="checkout-card-title">
                    <i class="fas fa-shopping-bag"></i> আপনার অর্ডার
                </h2>
                <div id="checkoutItemsList">
                    <div class="checkout-item-skeleton">
                        <div class="skeleton" style="width:60px;height:60px;border-radius:10px;"></div>
                        <div style="flex:1;">
                            <div class="skeleton" style="height:14px;width:70%;margin-bottom:8px;"></div>
                            <div class="skeleton" style="height:12px;width:40%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="checkout-card">
                <h2 class="checkout-card-title">
                    <i class="fas fa-map-marker-alt"></i> আপনার তথ্য
                </h2>
                
                <form id="checkoutForm" onsubmit="event.preventDefault(); placeOrder(event)" autocomplete="off">
                    
                    <div class="form-row">
                        <div class="form-field">
                            <label for="fullName">আপনার নাম *</label>
                            <input type="text" id="fullName" placeholder="আপনার সম্পূর্ণ নাম" required autocomplete="name">
                            <small class="field-error" id="fullNameError"></small>
                        </div>
                        
                        <div class="form-field">
                            <label for="phone">মোবাইল নম্বর *</label>
                            <input type="tel" id="phone" placeholder="01XXXXXXXXX" required autocomplete="tel" maxlength="11">
                            <small class="field-error" id="phoneError"></small>
                        </div>
                    </div>
                    
                    <div class="form-field" id="checkoutEmailField" hidden>
                        <label for="email">Email Address (Optional)</label>
                        <input type="email" id="email" placeholder="আপনার ইমেইল এড্রেস (ঐচ্ছিক)" autocomplete="email">
                    </div>
                    
                    <div class="form-field">
                        <label for="fullAddress">সম্পূর্ণ ঠিকানা *</label>
                        <textarea id="fullAddress" rows="3" placeholder="বাড়ি, রোড, এলাকা ও নিকটস্থ পরিচিত স্থান লিখুন" required autocomplete="street-address"></textarea>
                        <small class="field-error" id="fullAddressError"></small>
                    </div>

                    <div class="delivery-section">
                        <label>ডেলিভারি এরিয়া *</label>
                        <div class="delivery-options">
                            
                            <label class="delivery-option" id="deliveryInsideLabel">
                                <input type="checkbox" name="deliveryArea" value="inside" id="deliveryInsideCheckbox">
                                <span class="delivery-checkbox">
                                    <i class="fas fa-check"></i>
                                </span>
                                <span class="delivery-text">
                                    <strong>ঢাকার ভিতরে</strong>
                                    <small id="insideChargeText">৳60</small>
                                </span>
                            </label>
                            
                            <label class="delivery-option" id="deliveryOutsideLabel">
                                <input type="checkbox" name="deliveryArea" value="outside" id="deliveryOutsideCheckbox">
                                <span class="delivery-checkbox">
                                    <i class="fas fa-check"></i>
                                </span>
                                <span class="delivery-text">
                                    <strong>ঢাকার বাইরে</strong>
                                    <small id="outsideChargeText">৳120</small>
                                </span>
                            </label>
                            
                        </div>
                        <small class="field-error" id="deliveryAreaError"></small>
                    </div>
                    
                    <div class="form-field">
                        <label for="customerNote">অর্ডার নোট (ঐচ্ছিক)</label>
                        <textarea id="customerNote" rows="2" placeholder="কোনো বিশেষ নির্দেশনা থাকলে লিখুন"></textarea>
                    </div>
                    
                </form>
            </div>
            
            <div class="checkout-card summary-card">
                <h2 class="checkout-card-title">
                    <i class="fas fa-receipt"></i> অর্ডার সামারি
                </h2>
                
                <div class="summary-rows">
                    <div class="summary-row">
                        <span>পণ্যের মূল্য</span>
                        <span id="summarySubtotal">৳0</span>
                    </div>
                    <div class="summary-row">
                        <span>ডেলিভারি চার্জ</span>
                        <span id="summaryDelivery">৳0</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>সর্বমোট</span>
                        <span id="summaryTotal">৳0</span>
                    </div>
                </div>
                
                <button type="button" class="place-order-btn" id="placeOrderBtn" onclick="placeOrder(event)">
                    <i class="fas fa-check-circle"></i>
                    <span>অর্ডার নিশ্চিত করুন</span>
                    <i class="fas fa-spinner fa-spin" style="display:none;"></i>
                </button>
                
                <p class="secure-note">
                    <i class="fas fa-shield-alt"></i> Cash on Delivery Available
                </p>
            </div>
            
            <div class="checkout-card reviews-preview-card" id="reviewsPreviewCard">
                <div class="reviews-header-top-checkout">
                    <h2 class="checkout-card-title" style="margin:0;border:none;padding:0;">
                        <i class="fas fa-star"></i> Customer Reviews
                    </h2>
                </div>
                <div id="reviewsPreviewContent">
                    <div class="reviews-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading reviews...</p>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <div class="thank-you-modal" id="thankYouModal">
        <div class="thank-you-content">
            <div class="thank-you-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Thank You!</h2>
            <p>Your order has been placed successfully.</p>
            <div class="order-id-box">
                <span>Order ID</span>
                <strong id="thankYouOrderId">NV-000000</strong>
            </div>
            <p class="thank-you-note">We'll contact you soon to confirm your order.</p>
            <div class="thank-you-actions">
                <button class="btn-copy" onclick="copyOrderId()">
                    <i class="far fa-copy"></i> Copy Order ID
                </button>
                <button class="btn-continue" onclick="continueShopping()">
                    <i class="fas fa-shopping-bag"></i> Continue Shopping
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="assets/js/supabase-config.js?v=8"></script>
    <script src="assets/js/auth.js?v=8"></script>
    <script src="assets/js/cart-shared.js?v=8"></script>
    <script src="assets/js/location-data.js?v=8"></script>
    <script src="assets/js/checkout.js?v=8"></script>
</body>
</html>
