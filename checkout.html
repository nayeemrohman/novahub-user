<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- ==================== SEO ==================== -->
    <title>Checkout – Novahub | Secure Order Placement Bangladesh</title>
    <meta name="description" content="Complete your order at Novahub securely. Fast delivery across Bangladesh. Cash on Delivery available. Order premium gadget accessories now.">
    <meta name="author" content="Novahub">
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    
    <link rel="canonical" href="https://novahubgadgets.com/checkout">
    
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">
    <link rel="apple-touch-icon" href="assets/images/logo.jpg">
    
    <meta name="theme-color" content="#0A0A0A">
    
    <!-- ==================== PRECONNECT ==================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://oxnfiueqmvggtjtciqbn.supabase.co">
    
    <!-- ==================== STYLES ==================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css?v=3">
    <link rel="stylesheet" href="assets/css/checkout.css?v=3">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="checkout-page">

    <!-- ==================== MINIMAL TOP BAR ==================== -->
    <div class="checkout-topbar">
        <button class="checkout-back-btn" onclick="goBack()" aria-label="Back">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="checkout-brand">
            NOVA<span class="brand-red">HUB</span>
        </div>
        <div class="checkout-topbar-spacer"></div>
    </div>

    <!-- ==================== MAIN ==================== -->
    <main class="container checkout-container">
        
        <div class="checkout-wrapper">
            
            <!-- ==================== ORDER ITEMS ==================== -->
            <div class="checkout-card">
                <h2 class="checkout-card-title">
                    <i class="fas fa-shopping-bag"></i> Order Items
                </h2>
                <div id="checkoutItemsList">
                    <div class="checkout-item-skeleton">
                        <div class="skeleton" style="width:60px;height:60px;border-radius:10px;"></div>
                        <div style="flex:1;">
                            <div class="skeleton" style="height:14px;width:70%;margin-bottom:8px;"></div>
                            <div class="skeleton" style="height:12px;width:40%;"></div>
                        </div>
                    </div>
                    <div class="checkout-item-skeleton">
                        <div class="skeleton" style="width:60px;height:60px;border-radius:10px;"></div>
                        <div style="flex:1;">
                            <div class="skeleton" style="height:14px;width:70%;margin-bottom:8px;"></div>
                            <div class="skeleton" style="height:12px;width:40%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- ==================== SHIPPING INFO ==================== -->
            <div class="checkout-card">
                <h2 class="checkout-card-title">
                    <i class="fas fa-map-marker-alt"></i> Shipping Information
                </h2>
                
                <form id="checkoutForm" onsubmit="event.preventDefault(); placeOrder(event)" autocomplete="off">
                    
                    <!-- FULL NAME + PHONE -->
                    <div class="form-row">
                        <div class="form-field">
                            <label for="fullName">Full Name *</label>
                            <input type="text" id="fullName" placeholder="আপনার সম্পূর্ণ নাম" required autocomplete="name">
                            <small class="field-error" id="fullNameError"></small>
                        </div>
                        
                        <div class="form-field">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" placeholder="01XXXXXXXXX" required autocomplete="tel" maxlength="11">
                            <small class="field-error" id="phoneError"></small>
                        </div>
                    </div>
                    
                    <!-- EMAIL -->
                    <div class="form-field">
                        <label for="email">Email (Optional)</label>
                        <input type="email" id="email" placeholder="আপনার ইমেইল এড্রেস (অপশনাল)" autocomplete="email">
                    </div>
                    
                    <!-- ==================== DIVISION (SEARCHABLE) ==================== -->
                    <div class="form-field">
                        <label for="divisionSearch">Division *</label>
                        <div class="searchable-dropdown" id="divisionDropdown">
                            <div class="dropdown-trigger" onclick="toggleDropdown('divisionDropdown')">
                                <i class="fas fa-map-marker-alt dropdown-icon"></i>
                                <input type="text" 
                                       id="divisionSearch" 
                                       class="dropdown-search-input" 
                                       placeholder="বিভাগ খুঁজুন বা সিলেক্ট করুন..." 
                                       autocomplete="off"
                                       readonly>
                                <i class="fas fa-chevron-down dropdown-arrow"></i>
                            </div>
                            <div class="dropdown-menu" id="divisionMenu">
                                <div class="dropdown-list" id="divisionList"></div>
                            </div>
                        </div>
                        <input type="hidden" id="division" required>
                        <small class="field-error" id="divisionError"></small>
                    </div>
                    
                    <!-- DISTRICT + UPAZILA -->
                    <div class="form-row">
                        
                        <!-- ==================== DISTRICT (SEARCHABLE) ==================== -->
                        <div class="form-field">
                            <label for="districtSearch">District *</label>
                            <div class="searchable-dropdown" id="districtDropdown">
                                <div class="dropdown-trigger" onclick="toggleDropdown('districtDropdown')">
                                    <i class="fas fa-city dropdown-icon"></i>
                                    <input type="text" 
                                           id="districtSearch" 
                                           class="dropdown-search-input" 
                                           placeholder="জেলা খুঁজুন..." 
                                           autocomplete="off"
                                           readonly
                                           disabled>
                                    <i class="fas fa-chevron-down dropdown-arrow"></i>
                                </div>
                                <div class="dropdown-menu" id="districtMenu">
                                    <div class="dropdown-list" id="districtList"></div>
                                </div>
                            </div>
                            <input type="hidden" id="district" required>
                            <small class="field-error" id="districtError"></small>
                        </div>
                        
                        <!-- ==================== UPAZILA (SEARCHABLE) ==================== -->
                        <div class="form-field">
                            <label for="upazilaSearch">Thana / Upazila</label>
                            <div class="searchable-dropdown" id="upazilaDropdown">
                                <div class="dropdown-trigger" onclick="toggleDropdown('upazilaDropdown')">
                                    <i class="fas fa-building dropdown-icon"></i>
                                    <input type="text" 
                                           id="upazilaSearch" 
                                           class="dropdown-search-input" 
                                           placeholder="থানা/উপজেলা খুঁজুন..." 
                                           autocomplete="off"
                                           readonly
                                           disabled>
                                    <i class="fas fa-chevron-down dropdown-arrow"></i>
                                </div>
                                <div class="dropdown-menu" id="upazilaMenu">
                                    <div class="dropdown-list" id="upazilaList"></div>
                                </div>
                            </div>
                            <input type="hidden" id="upazila">
                            <small class="field-error" id="upazilaError"></small>
                        </div>
                    </div>
                    
                    <!-- VILLAGE / AREA -->
                    <div class="form-field">
                        <label for="village">Village / Area *</label>
                        <input type="text" id="village" placeholder="গ্রাম বা এলাকার নাম" required>
                        <small class="field-error" id="villageError"></small>
                    </div>
                    
                    <!-- FULL ADDRESS -->
                    <div class="form-field">
                        <label for="fullAddress">Full Address (House / Road)</label>
                        <textarea id="fullAddress" rows="2" placeholder="বাসা, রোড, ল্যান্ডমার্ক" autocomplete="street-address"></textarea>
                    </div>
                    
                    <!-- ==================== DELIVERY AREA ==================== -->
                    <div class="delivery-section">
                        <label>Delivery Area *</label>
                        <div class="delivery-options">
                            
                            <label class="delivery-option" id="deliveryInsideLabel">
                                <input type="checkbox" name="deliveryArea" value="inside" id="deliveryInsideCheckbox">
                                <span class="delivery-checkbox">
                                    <i class="fas fa-check"></i>
                                </span>
                                <span class="delivery-text">
                                    <strong>Inside Dhaka</strong>
                                    <small id="insideChargeText">৳60</small>
                                </span>
                            </label>
                            
                            <label class="delivery-option" id="deliveryOutsideLabel">
                                <input type="checkbox" name="deliveryArea" value="outside" id="deliveryOutsideCheckbox">
                                <span class="delivery-checkbox">
                                    <i class="fas fa-check"></i>
                                </span>
                                <span class="delivery-text">
                                    <strong>Outside Dhaka</strong>
                                    <small id="outsideChargeText">৳120</small>
                                </span>
                            </label>
                            
                        </div>
                        <small class="field-error" id="deliveryAreaError"></small>
                    </div>
                    
                    <!-- CUSTOMER NOTE -->
                    <div class="form-field">
                        <label for="customerNote">Order Notes (Optional)</label>
                        <textarea id="customerNote" rows="2" placeholder="কোনো বিশেষ নির্দেশনা থাকলে লিখুন"></textarea>
                    </div>
                    
                </form>
            </div>
            
            <!-- ==================== ORDER SUMMARY ==================== -->
            <div class="checkout-card summary-card">
                <h2 class="checkout-card-title">
                    <i class="fas fa-receipt"></i> Order Summary
                </h2>
                
                <div class="summary-rows">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="summarySubtotal">৳0</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Charge</span>
                        <span id="summaryDelivery">৳0</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>Total</span>
                        <span id="summaryTotal">৳0</span>
                    </div>
                </div>
                
                <button type="button" class="place-order-btn" id="placeOrderBtn" onclick="placeOrder(event)">
                    <i class="fas fa-check-circle"></i>
                    <span>Confirm Order</span>
                    <i class="fas fa-spinner fa-spin" style="display:none;"></i>
                </button>
                
                <p class="secure-note">
                    <i class="fas fa-shield-alt"></i> Cash on Delivery Available
                </p>
            </div>
            
            <!-- ==================== REVIEWS PREVIEW ==================== -->
            <div class="checkout-card reviews-preview-card" id="reviewsPreviewCard">
                <div class="reviews-header-top-checkout">
                    <h2 class="checkout-card-title" style="margin:0;border:none;padding:0;">
                        <i class="fas fa-star"></i> Customer Reviews
                    </h2>
                </div>
                <div id="reviewsPreviewContent">
                    <div class="reviews-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading reviews...</p>
                    </div>
                </div>
            </div>
            
        </div>
        
    </main>

    <!-- ==================== THANK YOU MODAL ==================== -->
    <div class="thank-you-modal" id="thankYouModal">
        <div class="thank-you-content">
            <div class="thank-you-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Thank You!</h2>
            <p>Your order has been placed successfully.</p>
            <div class="order-id-box">
                <span>Order ID</span>
                <strong id="thankYouOrderId">NV-000000</strong>
            </div>
            <p class="thank-you-note">We'll contact you soon to confirm your order.</p>
            <div class="thank-you-actions">
                <button class="btn-copy" onclick="copyOrderId()">
                    <i class="far fa-copy"></i> Copy Order ID
                </button>
                <button class="btn-continue" onclick="continueShopping()">
                    <i class="fas fa-shopping-bag"></i> Continue Shopping
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== TOAST ==================== -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="assets/js/supabase-config.js?v=3"></script>
    <script src="assets/js/location-data.js?v=3"></script>
    <script src="assets/js/auth.js?v=3"></script>
    <script src="assets/js/checkout.js?v=3"></script>
</body>
</html>
