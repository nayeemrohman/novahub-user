                </svg>
                <span id="googleBtnText">Continue with Google</span>
                <i class="fas fa-spinner fa-spin" id="googleBtnSpinner" style="display:none;"></i>
            </button>
        </div>
        
        <div class="auth-info-note">
            <i class="fas fa-shield-alt"></i>
            <p>Fast, secure & password-free login</p>
        </div>
        
        <div class="auth-terms-note">

                By continuing, you agree to our 
                <a href="terms.html">Terms & Conditions</a> 
                and 
                <a href="privacy.html">Privacy Policy</a>
