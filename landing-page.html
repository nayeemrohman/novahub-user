<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>Product | NovaHub</title><meta name="description" content="NovaHub product landing page">
<link rel="canonical" href="https://novahubgadgets.com/lp/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101114;--red:#e31e24;--muted:#626875;--line:#e7e8ec;--bg:#f7f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{color:inherit}.wrap{max-width:1080px;margin:auto;padding:20px}.brand{font-weight:800;letter-spacing:-.04em;font-size:22px}.brand span{color:var(--red)}.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:18px}.gallery img{width:100%;max-height:460px;object-fit:contain;background:#fff;border-radius:12px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:70px;height:70px;object-fit:contain;border:1px solid var(--line);border-radius:8px;cursor:pointer}.eyebrow{color:var(--red);font-weight:700;font-size:13px}.title{font-size:clamp(26px,4vw,42px);line-height:1.15;margin:10px 0}.price{font-size:28px;font-weight:800}.old{color:#8b9099;text-decoration:line-through;font-size:17px;margin-left:8px}.desc{color:var(--muted);line-height:1.7;white-space:pre-line}.buy{display:inline-block;background:var(--red);color:white;border:0;border-radius:10px;padding:14px 20px;font-weight:800;cursor:pointer;text-decoration:none}.section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}.formgrid input,.formgrid select,.formgrid textarea{border:1px solid #d7d9df;border-radius:9px;padding:12px;font:inherit;width:100%}.full{grid-column:1/-1}.summary{background:#f7f7f8;border-radius:10px;padding:14px;margin:14px 0;line-height:1.9}.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;color:#9a3412;font-size:13px}.status{margin-top:12px;font-size:14px}.status.error{color:#b42318}.status.ok{color:#067647}.video{width:100%;max-height:480px;border-radius:12px;background:#111}.footer{text-align:center;color:var(--muted);padding:28px 10px;font-size:13px}@media(max-width:760px){.wrap{padding:12px}.hero{grid-template-columns:1fr;padding:15px;gap:18px}.section{padding:16px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.gallery img{max-height:350px}}
</style>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
</script>
</head>
<body><main class="wrap">
<header><a class="brand" href="https://novahubgadgets.com/" style="text-decoration:none">NOVA<span>HUB</span></a></header>
<div id="pageStatus" class="section">পেজ লোড হচ্ছে…</div>
<div id="pageContent" hidden>
<section class="hero"><div class="gallery"><img id="mainImage" alt="Product image"><div id="thumbs" class="thumbs"></div><div id="videoWrap"></div></div><div><div class="eyebrow">NOVAHUB FEATURED PRODUCT</div><h1 id="productTitle" class="title"></h1><div><span id="price" class="price"></span><span id="oldPrice" class="old"></span></div><p id="description" class="desc"></p><button class="buy" onclick="document.getElementById('order').scrollIntoView({behavior:'smooth'})">অর্ডার করুন</button></div></section>
<section class="section" id="order"><h2>অর্ডার ফর্ম</h2><p class="desc">সঠিক তথ্য দিয়ে ফর্মটি পূরণ করুন।</p><form id="orderForm"><div class="formgrid">
<label>আপনার নাম *<input name="full_name" required maxlength="120" autocomplete="name"></label>
<label>মোবাইল নম্বর *<input name="phone" required inputmode="tel" pattern="01[3-9][0-9]{8}" maxlength="11" placeholder="01XXXXXXXXX" autocomplete="tel"></label>
<label>ইমেইল (ঐচ্ছিক)<input name="email" type="email" autocomplete="email"></label>
<label>ডেলিভারি এলাকা *<select name="delivery_area" required><option value="">নির্বাচন করুন</option><option value="inside">ঢাকার ভিতরে</option><option value="outside">ঢাকার বাইরে</option></select></label>
<label>জেলা *<input name="district" required maxlength="100"></label>
<label>বিভাগ *<input name="division" required maxlength="100"></label>
<label>উপজেলা/থানা<input name="upazila" maxlength="100"></label>
<label>গ্রাম/এলাকা<input name="village" maxlength="150"></label>
<label class="full">সম্পূর্ণ ঠিকানা *<textarea name="full_address" rows="3" required maxlength="500"></textarea></label>
<label class="full">নোট (ঐচ্ছিক)<textarea name="customer_note" rows="2" maxlength="500"></textarea></label>
</div><div class="summary" id="summary">ডেলিভারি চার্জ লোড হচ্ছে…</div><div id="formNotice" class="notice">অর্ডার দেওয়ার আগে মূল্য ও ঠিকানা যাচাই করুন।</div><p><button id="submitOrder" class="buy" type="submit">অর্ডার কনফার্ম করুন</button></p><div id="formStatus" class="status" role="status"></div></form></section>
</div><footer class="footer">© <span id="year"></span> NovaHub. All rights reserved.</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script>
<script>
(function(){'use strict';const $=id=>document.getElementById(id);let page=null,settings=null,busy=false,selectedImage=0;const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').filter(Boolean).pop();const money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(msg,type=''){ $('formStatus').className='status '+type;$('formStatus').textContent=msg; }
function updateSummary(){if(!page||!settings)return;const area=$('orderForm').elements.delivery_area.value;const charge=area==='inside'?Number(settings.inside_dhaka_charge):area==='outside'?Number(settings.outside_dhaka_charge):null;$('summary').innerHTML='পণ্যের মূল্য: <strong>'+money(page.price)+'</strong><br>ডেলিভারি চার্জ: <strong>'+(charge===null?'এলাকা নির্বাচন করুন':money(charge))+'</strong><br>সর্বমোট: <strong>'+money(Number(page.price)+(charge===null?0:charge))+'</strong>';}
function render(){document.title=(page.seo_title||page.title)+' | NovaHub';const desc=page.seo_description||page.description||'';document.querySelector('meta[name="description"]').content=desc.slice(0,320);document.querySelector('link[rel="canonical"]').href=location.origin+'/lp/'+encodeURIComponent(page.slug);if(page.seo_image_url){let m=document.createElement('meta');m.setAttribute('property','og:image');m.content=page.seo_image_url;document.head.appendChild(m)}$('pageStatus').hidden=true;$('pageContent').hidden=false;$('productTitle').textContent=page.title||page.product_name;$('price').textContent=money(page.price);$('oldPrice').textContent=page.compare_at_price?money(page.compare_at_price):'';$('description').textContent=page.description||'';const imgs=Array.isArray(page.images)?page.images:[];if(imgs.length){$('mainImage').src=imgs[0];$('mainImage').alt=page.product_name;$('thumbs').innerHTML=imgs.map((u,i)=>'<img src="'+safe(u)+'" alt="'+safe(page.product_name)+' image '+(i+1)+'" data-image-index="'+i+'" loading="lazy">').join('');$('thumbs').querySelectorAll('img').forEach(im=>im.addEventListener('click',()=>{$('mainImage').src=imgs[Number(im.dataset.imageIndex)]}));}else{$('mainImage').hidden=true}if(page.video_url){$('videoWrap').innerHTML='<video class="video" controls playsinline preload="metadata" src="'+safe(page.video_url)+'"></video>'}else $('videoWrap').remove();if(typeof fbq==='function'&&window.settings?.metaPixelEnabled&&window.settings?.metaPixelId){fbq('init',String(window.settings.metaPixelId));fbq('track','PageView');fbq('track','ViewContent',{content_name:page.product_name,content_type:'product',value:Number(page.price),currency:'BDT'});} }
async function init(){ $('year').textContent=new Date().getFullYear();if(!slug){$('pageStatus').textContent='পেজের ঠিকানা সঠিক নয়।';return}const db=window.supabaseClient;if(!db){$('pageStatus').textContent='Database connection unavailable.';return}const [pr,sr]=await Promise.all([db.from('landing_pages').select('*').eq('slug',slug).eq('is_published',true).maybeSingle(),db.from('settings').select('inside_dhaka_charge,outside_dhaka_charge,currency,order_prefix,webhook_url,meta_pixel_id,meta_pixel_enabled').eq('id',1).maybeSingle()]);if(pr.error||!pr.data){$('pageStatus').textContent='এই পেজটি পাওয়া যায়নি অথবা এখনো প্রকাশিত হয়নি।';return}if(sr.error||!sr.data){$('pageStatus').textContent='ডেলিভারি ও অর্ডার সেটিংস লোড করা যায়নি। অর্ডার নেওয়া আপাতত বন্ধ রাখা হয়েছে।';return}page=pr.data;settings=sr.data;window.settings={...(window.settings||{}),currency:settings.currency||'BDT',insideDhakaCharge:Number(settings.inside_dhaka_charge),outsideDhakaCharge:Number(settings.outside_dhaka_charge),webhookUrl:settings.webhook_url||'',metaPixelId:settings.meta_pixel_id||'',metaPixelEnabled:settings.meta_pixel_enabled===true};render();updateSummary();$('orderForm').elements.delivery_area.addEventListener('change',updateSummary);}
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;if(!page||!settings)return;const form=e.currentTarget;if(!form.reportValidity())return;const fd=new FormData(form);const phone=String(fd.get('phone')||'').trim();if(!/^01[3-9]\d{8}$/.test(phone)){status('সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন।','error');return}const area=String(fd.get('delivery_area'));const charge=area==='inside'?Number(settings.inside_dhaka_charge):area==='outside'?Number(settings.outside_dhaka_charge):NaN;if(!Number.isFinite(charge)||charge<0){status('ডেলিভারি চার্জ নির্ধারণ করা যায়নি। অর্ডার নেওয়া যাচ্ছে না।','error');return}busy=true;const btn=$('submitOrder');btn.disabled=true;btn.textContent='অর্ডার পাঠানো হচ্ছে…';status('অর্ডার সংরক্ষণ করা হচ্ছে…');try{const orderId=(settings.order_prefix||'NV')+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();const subtotal=Number(page.price);const user=await window.getCurrentUser();const row={order_id:orderId,user_id:user?.id||null,full_name:String(fd.get('full_name')).trim(),phone,email:String(fd.get('email')||'').trim()||null,division:String(fd.get('division')).trim(),district:String(fd.get('district')).trim(),upazila:String(fd.get('upazila')||'').trim()||null,village:String(fd.get('village')||'').trim(),full_address:String(fd.get('full_address')).trim(),delivery_area:area,delivery_area_text:area==='inside'?'Inside Dhaka':'Outside Dhaka',customer_note:String(fd.get('customer_note')||'').trim()||null,items:[{productId:'landing:'+page.id,title:page.product_name,imageURL:(page.images||[])[0]||null,quantity:1,price:subtotal,selectedVariant:null}],subtotal,delivery_charge:charge,total:subtotal+charge,currency:settings.currency||'BDT',status:'pending'};const {data,error}=await window.supabaseClient.from('orders').insert(row).select().single();if(error)throw error;if(!data)throw new Error('Order save returned no record');if(settings.webhook_url){fetch(settings.webhook_url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'order.created',source:'novahub-landing-page',timestamp:new Date().toISOString(),order_id:data.order_id,customer:{full_name:data.full_name,phone:data.phone,email:data.email},items:data.items,pricing:{subtotal:data.subtotal,delivery_charge:data.delivery_charge,total:data.total,currency:data.currency},shipping_address:{division:data.division,district:data.district,upazila:data.upazila,village:data.village,full_address:data.full_address,delivery_area:data.delivery_area},customer_note:data.customer_note})}).catch(err=>console.error('Webhook delivery failed',err));}if(typeof window.trackPurchase==='function'){window.trackPurchase(data.order_id,(data.items||[]).map(i=>({productId:i.productId,quantity:i.quantity,price:i.price})),Number(data.total),{email:data.email,phone:data.phone,full_name:data.full_name,district:data.district,division:data.division,user_id:data.user_id,currency:data.currency||'BDT'});}else if(typeof fbq==='function'){const eventId=String(data.order_id);fbq('track','Purchase',{content_ids:['landing:'+page.id],content_type:'product',value:Number(data.total),currency:'BDT'},{eventID:eventId});fetch('/api/meta-capi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_name:'Purchase',event_id:eventId,event_source_url:location.href,action_source:'website',custom_data:{value:Number(data.total),currency:'BDT',content_ids:['landing:'+page.id],content_type:'product',num_items:1,order_id:eventId}})}).catch(err=>console.error('CAPI request failed',err));}status('অর্ডার সফলভাবে গ্রহণ করা হয়েছে। অর্ডার নম্বর: '+data.order_id,'ok');form.reset();updateSummary();}catch(err){console.error('Landing page order failed',err);status('অর্ডার সম্পন্ন হয়নি: '+(err.message||'Unknown error')+'। অনুগ্রহ করে আবার চেষ্টা করুন।','error')}finally{busy=false;btn.disabled=false;btn.textContent='অর্ডার কনফার্ম করুন';}});
init().catch(err=>{console.error(err);$('pageStatus').textContent='পেজ লোড করতে সমস্যা হয়েছে।'});
})();
</script></body></html>
