<body>

    <!-- ===== HEADER ===== -->
    <header class="sticky-header header-compact">
        <div class="header-left">
            <button class="menu-toggle-btn" onclick="window.location.href='index.html'" aria-label="Back">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
        <div class="header-center">
            <h1 class="header-title">My Profile</h1>
        </div>
        <div class="header-right">
            <button class="header-home-btn" onclick="handleLogout()" aria-label="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container profile-container" id="profileContainer">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading profile...</p>
        </div>
    </main>

    <!-- ===== PHOTO UPLOAD INPUT (Hidden) ===== -->
    <input type="file" id="profilePhotoInput" accept="image/*" class="hidden-file-input">

    <!-- ===== TOAST ===== -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="assets/js/supabase-config.js?v=3"></script>
    <script src="assets/js/location-data.js?v=3"></script>
