<body class="product-page">

    <!-- ==================== HEADER ==================== -->
    <header class="sticky-header header-compact">
        <div class="header-left">
            <button class="menu-toggle-btn" id="headerProfileBtn" onclick="handleProfileClick()" aria-label="Profile">
                <i class="fas fa-user" id="headerProfileIcon"></i>
            </button>
        </div>
        <div class="header-center">
            <h1 class="header-title">NOVA<span class="brand-red">HUB</span></h1>
        </div>
        <div class="header-right">
            <button class="cart-icon-container" id="headerCartBtn" onclick="openCartFromProduct()" aria-label="Cart">
                <i class="fas fa-shopping-cart cart-icon"></i>
                <span id="cartCount" class="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- ==================== BREADCRUMB ==================== -->
    <nav class="breadcrumb-nav container" aria-label="Breadcrumb" id="breadcrumbNav" style="display:none;">
        <ol class="breadcrumb-list" id="breadcrumbList">
            <li><a href="index.html">Home</a></li>
        </ol>
    </nav>

    <!-- ==================== MAIN ==================== -->
    <main class="container product-main" itemscope itemtype="https://schema.org/Product">
        
        <div id="productContainer">
            <!-- Initial skeleton -->
            <div class="product-details">
                <div class="product-images-section">
                    <div class="main-image-container skeleton"></div>
                </div>
                <div class="product-details-info">
                    <div class="skeleton" style="height:32px;width:80%;margin-bottom:16px;"></div>
                    <div class="skeleton" style="height:80px;width:100%;margin-bottom:16px;"></div>
                    <div class="skeleton" style="height:120px;width:100%;margin-bottom:16px;"></div>
                    <div class="skeleton" style="height:100px;width:100%;"></div>
                </div>
            </div>
        </div>
        
        <!-- ==================== REVIEWS ==================== -->
        <section id="reviewsSection" class="reviews-section" style="display:none;">
            <div class="reviews-header">
                <div class="reviews-header-top">
                    <h2><i class="fas fa-star"></i> Customer Reviews</h2>
                    <button class="write-review-btn-small" id="writeReviewBtn" onclick="openReviewModal()" style="display:none;">
                        <i class="fas fa-pen"></i> Write Review
                    </button>
                </div>
                <div id="reviewsSummary" class="reviews-summary"></div>
            </div>
            
            <div id="loginToReview" class="login-to-review" style="display:none;">
                <i class="fas fa-lock"></i>
                <p>Please <a href="auth.html">login</a> to write a review</p>
            </div>
            
            <div class="reviews-scroll-wrapper">
                <div id="reviewsScrollTrack" class="reviews-scroll-track">
                    <div class="no-reviews" style="width:100%;min-width:100%;">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading reviews...</p>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- ==================== RELATED PRODUCTS ==================== -->
        <section id="relatedSection" class="product-section" style="display:none;">
            <h2 class="section-title">Related Products</h2>
            <div class="products-grid" id="relatedGrid"></div>
        </section>
        
    </main>

    <!-- ==================== IMAGE LIGHTBOX ==================== -->
    <div id="imageLightbox" class="image-lightbox">
        <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">
            <i class="fas fa-times"></i>
        </button>
        <img id="lightboxImage" class="lightbox-image" src="" alt="Product Preview" onclick="event.stopPropagation();">
    </div>

    <!-- ==================== REVIEW MODAL ==================== -->
    <div id="reviewModal" class="review-modal">
        <div class="review-modal-content">
            <div class="review-modal-header">
                <h3><i class="fas fa-star"></i> Write a Review</h3>
                <button class="review-modal-close" onclick="closeReviewModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="review-modal-body">
                <div class="review-field">
                    <label>Your Rating *</label>
                    <div class="star-rating" id="starRating">
                        <i class="far fa-star" data-rating="1"></i>
                        <i class="far fa-star" data-rating="2"></i>
                        <i class="far fa-star" data-rating="3"></i>
                        <i class="far fa-star" data-rating="4"></i>
                        <i class="far fa-star" data-rating="5"></i>
                    </div>
                    <small class="rating-text" id="ratingText">Tap to rate</small>
                </div>
                
                <div class="review-field">
                    <label>Your Review</label>
                    <textarea id="reviewComment" rows="4" placeholder="Share your experience with this product..."></textarea>
                </div>
                
                <div class="review-field">
                    <label>Add Photo (Optional)</label>
                    <div class="review-image-upload">
                        <input type="file" id="reviewImage1" accept="image/*" style="display:none;">
                        <div class="image-upload-single" onclick="document.getElementById('reviewImage1').click()" id="slot1">
                            <i class="fas fa-camera"></i>
                            <small>Tap to add photo</small>
                        </div>
                    </div>
                    <small class="review-hint">Image will be auto-compressed to under 1MB</small>
                </div>
            </div>
            
            <div class="review-modal-footer">
                <button class="btn-cancel" onclick="closeReviewModal()">Cancel</button>
                <button class="btn-submit-review" id="submitReviewBtn" onclick="submitReview()">
                    <span><i class="fas fa-paper-plane"></i> Submit</span>
                    <i class="fas fa-spinner fa-spin" style="display:none;"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== TOAST ==================== -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="assets/js/auth.js?v=3"></script>
    <script src="assets/js/product.js?v=3"></script>
</body>
