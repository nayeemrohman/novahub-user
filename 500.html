<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>500 – Server Error | Novahub</title>
    <meta name="description" content="Something went wrong on our end. We're working to fix it.">
    <meta name="author" content="Novahub">
    
    <meta name="robots" content="noindex, follow">
    <meta name="googlebot" content="noindex, follow">
    
    <link rel="canonical" href="https://novahubgadgets.com/500.html">
    
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">
    <link rel="apple-touch-icon" href="assets/images/logo.jpg">
    
    <meta name="theme-color" content="#0A0A0A">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F5F5F5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        
        .error-container {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid #E5E5E5;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .error-code {
            font-size: 84px;
            font-weight: 900;
            color: #0A0A0A;
            line-height: 1;
            letter-spacing: -4px;
        }
        
        .error-code span { color: #E31E24; }
        
        .error-icon {
            font-size: 48px;
            color: #E31E24;
            margin: 14px 0;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }
        
        .error-container h1 {
            font-size: 22px;
            color: #0A0A0A;
            margin-bottom: 8px;
            font-weight: 800;
        }
        
        .error-container p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .error-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 30px;
            background: #E31E24;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 2px solid #E31E24;
            cursor: pointer;
            font-family: inherit;
        }
        
        .error-btn:hover:not(:disabled) {
            background: #B71C1C;
            border-color: #B71C1C;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(227,30,36,0.3);
        }
        
        .error-btn.secondary {
            background: #FFFFFF;
            color: #0A0A0A;
            border-color: #E5E5E5;
        }
        
        .error-btn.secondary:hover {
            background: #0A0A0A;
            color: #FFFFFF;
            border-color: #0A0A0A;
        }
        
        .error-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-btn i.rotating {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-brand {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid #E5E5E5;
            font-size: 12px;
            color: #888;
        }
        
        .error-brand strong {
            color: #0A0A0A;
            font-weight: 800;
            letter-spacing: 1px;
        }
        
        .error-brand .red { color: #E31E24; }
        
        .retry-info {
            display: none;
            font-size: 12px;
            color: #888;
            margin-top: 12px;
            font-style: italic;
        }
        
        .retry-info.show { display: block; }
        
        @media (max-width: 480px) {
            .error-container { padding: 40px 24px; }
            .error-code { font-size: 72px; }
            .error-icon { font-size: 40px; }
            .error-container h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    
    <div class="error-container">
        <div class="error-code">5<span>0</span>0</div>
        <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h1>Server Error</h1>
        <p>Something went wrong on our end. We're working to fix it. Please try again in a moment.</p>
        
        <div class="error-actions">
            <button id="retryBtn" class="error-btn" onclick="retryPage()">
                <i class="fas fa-redo" id="retryIcon"></i>
                <span id="retryText">Try Again</span>
            </button>
            <a href="index.html" class="error-btn secondary">
                <i class="fas fa-home"></i> Go Home
            </a>
        </div>
        
        <div class="retry-info" id="retryInfo"></div>
        
        <div class="error-brand">
            &copy; 2026 <strong>NOVA<span class="red">HUB</span></strong> — Your Gadget Destination
        </div>
    </div>
    
    <script>
        let retryCount = 0;
        const MAX_RETRIES = 3;
        
        function retryPage() {
            if (retryCount >= MAX_RETRIES) {
                showRetryInfo('Maximum retries reached. Please go home or try again later.');
                return;
            }
            
            retryCount++;
            
            const btn = document.getElementById('retryBtn');
            const icon = document.getElementById('retryIcon');
            const text = document.getElementById('retryText');
            
            btn.disabled = true;
            icon.classList.add('rotating');
            text.textContent = 'Retrying...';
            
            setTimeout(() => {
                window.location.reload();
            }, 1500);
        }
        
        function showRetryInfo(msg) {
            const info = document.getElementById('retryInfo');
            info.textContent = msg;
            info.classList.add('show');
        }
    </script>
    
</body>
</html>
